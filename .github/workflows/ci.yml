name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Parse Windows physical self-checks
        shell: pwsh
        run: |
          foreach ($path in @(
            "tools/P3_GATE15_FINAL_SELF_CHECK.ps1",
            "tools/P4_SW01_FINAL_SELF_CHECK.ps1",
            "tools/P4_SW01_WINDOWS_GATE.ps1",
            "tools/P4_SW01_LOCAL_RECOVERY.ps1",
            "tools/P4B_SD01_STYLE_REVIEW.ps1",
            "tools/P4C_SD01_FINAL_SELF_CHECK.ps1",
            "tools/P4C_SD01_WINDOWS_GATE.ps1",
            "tools/P5_QA01_CAPABILITY_PROBE.ps1",
            "tools/P5_QA01_LOCAL_PROBE_GATE.ps1",
            "tools/P5_QA01_PATH_C_INSTALL_GATE.ps1",
            "tools/P5_QA01_RUNTIME_GATE.ps1",
            "tools/P5_QA01_PATH_C_LOCAL_GATE.ps1",
            "tools/P5_QA01_RUNTIME_LOCAL_GATE.ps1",
            "tools/P5_QA01_STYLE_SAMPLE_GATE.ps1",
            "tools/P5_QA01_STYLE_SAMPLE_LOCAL_GATE.ps1",
            "tools/P5_QA01_STYLE_SAMPLE_RECOVERY_GATE.ps1",
            "tools/P5_QA01_STYLE_SAMPLE_RECOVERY_LOCAL_GATE.ps1"
          )) {
            $text = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("${path}: " + $_.Message) }
              exit 1
            }
          }
      - name: Parse validation page JavaScript
        run: |
          node --check apps/web/public/archive.js
          node --check apps/web/public/sw01.js
          node --check apps/web/public/sd01-style.js
          node --check apps/web/public/sd01.js
      - run: npm ci
      - run: npm test
      - run: npm run build
