name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Parse Windows physical self-checks
        shell: pwsh
        run: |
          foreach ($path in @(
            "tools/P3_GATE15_FINAL_SELF_CHECK.ps1",
            "tools/P3B_3D_WINDOWS_GATE.ps1",
            "tools/P3B_MASK_WINDOWS_GATE.ps1",
            "tools/P3B_MASK_REFINE_WINDOWS_GATE.ps1",
            "tools/P3B_SUPPORT_V2_WINDOWS_GATE.ps1",
            "tools/P3B_SUPPORT_V3_WINDOWS_GATE.ps1",
            "tools/P3B_SAM2_VIDEO_TRACKING_GATE.ps1",
            "tools/P3B_SAM31_WINDOWS_PROBE.ps1",
            "tools/P3B_SAM31_VIDEO_GATE.ps1",
            "tools/P3B_VIDEO_SOURCE_IDENTITY_TRIAGE.ps1",
            "tools/P3B_REPLACEMENT_SOURCE_IDENTITY_GATE.ps1",
            "tools/P4_SW01_FINAL_SELF_CHECK.ps1",
            "tools/P4_SW01_WINDOWS_GATE.ps1",
            "tools/P4_SW01_LOCAL_RECOVERY.ps1",
            "tools/P4B_SD01_STYLE_REVIEW.ps1",
            "tools/P4C_SD01_FINAL_SELF_CHECK.ps1",
            "tools/P4C_SD01_WINDOWS_GATE.ps1"
          )) {
            $text = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("${path}: " + $_.Message) }
              exit 1
            }
          }
      - name: Verify SAM3.1 benchmark safety contracts and session adapter
        run: |
          python3 -m unittest discover -s tools -p 'test_p3b_sam31_contracts.py' -v
          python3 -m unittest discover -s tools -p 'test_p3b_sam31_session_compat.py' -v
          python3 -m unittest discover -s tools -p 'test_p3b_sam31_decoder_sdpa_compat.py' -v
      - name: Parse validation page JavaScript
        run: |
          node --check apps/web/public/archive.js
          node --check apps/web/public/sw01.js
          node --check apps/web/public/sd01-style.js
          node --check apps/web/public/sd01.js
      - run: npm ci
      - run: npm test
      - run: npm run build
